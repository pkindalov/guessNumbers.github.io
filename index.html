<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Numbers - Modern Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles/guessNumbers.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl p-8">
        <header id="gameTittle" class="mb-8 text-center">
            <h1 class="text-4xl font-extrabold text-indigo-600 tracking-tight">Guess the Numbers</h1>
            <p class="text-slate-500 mt-2">Fill the grid to satisfy all equations.</p>
        </header>

        <main id="gameContainer" class="relative">
            <div id="numbersTable" class="grid grid-cols-7 gap-2 md:gap-4 mb-8">
                <!-- Row 1 -->
                <div class="cell bg-emerald-100 rounded-lg p-1 flex items-center justify-center">
                    <input id="firstRowFirstNum" type="number" disabled class="w-full bg-transparent text-center font-bold text-emerald-800 outline-none" value="24">
                </div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400" id="firstRowSecColDelete">:</div>
                <div class="cell bg-slate-100 rounded-lg p-1 flex items-center justify-center border-2 border-transparent transition-all">
                    <input id="firstRowSecNum" type="number" disabled class="w-full bg-transparent text-center font-semibold outline-none" value="4">
                </div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400" id="firstRowFourColAddition">+</div>
                <div class="cell bg-slate-100 rounded-lg p-1 flex items-center justify-center border-2 border-transparent transition-all">
                    <input id="firstRowThirdNum" type="number" disabled class="w-full bg-transparent text-center font-semibold outline-none" value="7">
                </div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400" id="firstRowEqualSign">=</div>
                <div class="cell bg-emerald-100 rounded-lg p-1 flex items-center justify-center">
                    <input id="firstRowTotalNum" type="number" disabled class="w-full bg-transparent text-center font-bold text-emerald-800 outline-none" value="13">
                </div>

                <!-- Row 2 (Operators) -->
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">:</div>
                <div></div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">*</div>
                <div></div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">+</div>
                <div></div>
                <div></div>

                <!-- Row 3 -->
                <div class="cell bg-slate-100 rounded-lg p-1 flex items-center justify-center border-2 border-transparent transition-all">
                    <input id="thirdRowFirstNum" type="number" disabled class="w-full bg-transparent text-center font-semibold outline-none" value="8">
                </div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">+</div>
                <div class="cell bg-slate-100 rounded-lg p-1 flex items-center justify-center border-2 border-transparent transition-all">
                    <input id="thirdRowSecNum" type="number" disabled class="w-full bg-transparent text-center font-semibold outline-none" value="9">
                </div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">-</div>
                <div class="cell bg-slate-100 rounded-lg p-1 flex items-center justify-center border-2 border-transparent transition-all">
                    <input id="thirdRowThirdNum" type="number" disabled class="w-full bg-transparent text-center font-semibold outline-none" value="2">
                </div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">=</div>
                <div class="cell bg-emerald-100 rounded-lg p-1 flex items-center justify-center">
                    <input id="thirdRowTotalNum" type="number" disabled class="w-full bg-transparent text-center font-bold text-emerald-800 outline-none" value="15">
                </div>

                <!-- Row 4 (Operators) -->
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">*</div>
                <div></div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">:</div>
                <div></div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">*</div>
                <div></div>
                <div></div>

                <!-- Row 5 -->
                <div class="cell bg-slate-100 rounded-lg p-1 flex items-center justify-center border-2 border-transparent transition-all">
                    <input id="fifthRowFirstNum" type="number" disabled class="w-full bg-transparent text-center font-semibold outline-none" value="5">
                </div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">*</div>
                <div class="cell bg-slate-100 rounded-lg p-1 flex items-center justify-center border-2 border-transparent transition-all">
                    <input id="fifthRowSecNum" type="number" disabled class="w-full bg-transparent text-center font-semibold outline-none" value="6">
                </div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">:</div>
                <div class="cell bg-slate-100 rounded-lg p-1 flex items-center justify-center border-2 border-transparent transition-all">
                    <input id="fifthRowThirdNum" type="number" disabled class="w-full bg-transparent text-center font-semibold outline-none" value="3">
                </div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">=</div>
                <div class="cell bg-emerald-100 rounded-lg p-1 flex items-center justify-center">
                    <input id="fifthRowTotalNum" type="number" disabled class="w-full bg-transparent text-center font-bold text-emerald-800 outline-none" value="10">
                </div>

                <!-- Row 6 (Equals) -->
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">=</div>
                <div></div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">=</div>
                <div></div>
                <div class="flex items-center justify-center text-2xl font-bold text-slate-400">=</div>
                <div></div>
                <div></div>

                <!-- Row 7 (Vertical Totals) -->
                <div class="cell bg-emerald-100 rounded-lg p-1 flex items-center justify-center">
                    <input id="verticalTotalOne" type="number" disabled class="w-full bg-transparent text-center font-bold text-emerald-800 outline-none" value="15">
                </div>
                <div></div>
                <div class="cell bg-emerald-100 rounded-lg p-1 flex items-center justify-center">
                    <input id="verticalTotalTwo" type="number" disabled class="w-full bg-transparent text-center font-bold text-emerald-800 outline-none" value="6">
                </div>
                <div></div>
                <div class="cell bg-emerald-100 rounded-lg p-1 flex items-center justify-center">
                    <input id="verticalTotalThree" type="number" disabled class="w-full bg-transparent text-center font-bold text-emerald-800 outline-none" value="13">
                </div>
                <div></div>
                <div></div>
            </div>

            <summary class="block text-sm text-slate-400 mb-6 italic text-center">Above is an example of a correctly filled grid.</summary>
        </main>

        <section id="difficultyContainer" class="mb-8 text-center">
            <h5 class="text-lg font-semibold text-slate-700 mb-4">Select Difficulty</h5>
            <div class="flex justify-center gap-3">
                <button class="difficulty-btn px-6 py-2 rounded-full font-medium transition-all bg-slate-200 text-slate-600 hover:bg-slate-300 active-difficulty" data-difficulty="easy">Easy</button>
                <button class="difficulty-btn px-6 py-2 rounded-full font-medium transition-all bg-slate-200 text-slate-600 hover:bg-slate-300" data-difficulty="medium">Medium</button>
                <button class="difficulty-btn px-6 py-2 rounded-full font-medium transition-all bg-slate-200 text-slate-600 hover:bg-slate-300" data-difficulty="hard">Hard</button>
            </div>
        </section>

        <div id="errorsContainer" class="text-center mb-6 min-h-[1.5rem]"></div>

        <footer class="flex justify-center">
            <button id="startGame" class="px-8 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 hover:-translate-y-0.5 transition-all flex items-center gap-2">
                Start Game
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
            <button id="sendResult" class="hidden px-8 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 hover:-translate-y-0.5 transition-all flex items-center gap-2">
                Check Results
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
            </button>
        </footer>
    </div>

    <script type="module" src="./scripts/guessNumberss.js"></script>
</body>
</html>
