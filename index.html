<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Guess the numbers</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <!-- Compiled and minified CSS -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <!-- <link rel='stylesheet' type='text/css' media='screen' href='main.css'> -->
</head>

<body>
    <div class="contaner">
        <div class="row">
            <div class="col s12 center-align">
                <h1>Guess the numbers</h1>
            </div>
        </div>
        <div class="row">
            <div class="col s12 center-align">
                <table class="highlight" id="numbersTable">
                    <!-- First row of matrix -->
                    <tr>
                        <td>
                            <input id="firstRowFirstNum" type="number" value="24" />
                        </td>
                        <td class="mathSymbol" id="firstRowSecColDelete">:</td>
                        <td>
                            <input id="firstRowSecNum" type="number" value="4" />
                        </td>
                        <td class="mathSymbol" id="firstRowFourColAddition">+</td>
                        <td>
                            <input id="firstRowThirdNum" type="number" value="7" />
                        </td>
                        <td class="mathSymbol" id="firstRowEqualSign">=</td>
                        <td>
                            <input id="firstRowTotalNum" type="number" value="13" />
                        </td>
                    </tr>


                    <!-- Second Row -->
                    <tr>
                        <td class="mathSymbol">:</td>
                        <td class="empty">&nbsp;</td>
                        <td class="mathSymbol">*</td>
                        <td class="empty">&nbsp;</td>
                        <td class="mathSymbol">+</td>
                        <td class="empty">&nbsp;</td>
                        <td class="empty">&nbsp;</td>
                    </tr>
                    <!-- Third row -->
                    <tr>
                        <td>
                            <input id="thirdRowFirstNum" type="number" value="8" />
                        </td>
                        <td class="mathSymbol">+</td>
                        <td>
                            <input id="thirdRowSecNum" type="number" value="9" />
                        </td>
                        <td class="mathSymbol">-</td>
                        <td>
                            <input id="thirdRowThirdNum" type="number" value="2" />
                        </td>
                        <td class="mathSymbol">=</td>
                        <td>
                            <input id="thirdRowTotalNum" type="number" value="15" />
                        </td>
                    </tr>
                    <!-- Fourth row -->
                    <tr>
                        <td class="mathSymbol">*</td>
                        <td class="empty">&nbsp;</td>
                        <td class="mathSymbol">/</td>
                        <td class="empty">&nbsp;</td>
                        <td class="mathSymbol">*</td>
                        <td class="empty">&nbsp;</td>
                        <td class="empty">&nbsp;</td>
                    </tr>
                    <!-- Fifth row -->
                    <tr>
                        <td>
                            <input id="fifthRowFirstNum" type="number" value="5" />
                        </td>
                        <td class="mathSymbol">*</td>
                        <td>
                            <input id="fifthRowSecNum" type="number" value="6" />
                        </td>
                        <td class="mathSymbol">/</td>
                        <td>
                            <input id="fifthRowThirdNum" type="number" value="3" />
                        </td>
                        <td class="mathSymbol">=</td>
                        <td>
                            <input id="fifthRowTotalNum" type="number" value="10" />
                        </td>
                    </tr>
                    <!-- Sixth row -->
                    <tr>
                        <td class="mathSymbol">=</td>
                        <td class="empty">&nbsp;</td>
                        <td class="mathSymbol">=</td>
                        <td class="empty">&nbsp;</td>
                        <td class="mathSymbol">=</td>
                        <td class="empty">&nbsp;</td>
                        <td class="empty">&nbsp;</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>


    <script src='./scripts/guessNumberss.js'></script>
</body>

</html>
